      <text x="22" y="221" class="st">ระบายสีกลีบ ฐาน และดอกไม้ (สีเข้มถ่ายติดชัดกว่า)</text>
      <text x="22" y="225.6" class="sj">花びら・台・花に色をぬる（濃い色がおすすめ）</text>
    </g>
