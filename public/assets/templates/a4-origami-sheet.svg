      <text x="22" y="250.4" class="sj">実線にそって切る</text>
    </g>
<g>
      <circle cx="16" cy="258" r="3.1" fill="#f5c66a"/>
      <text x="16" y="259.2" class="num">4</text>
      <text x="22" y="258.2" class="st">พับผนัง 4 ด้านขึ้นตามเส้นประ แล้วทากาวที่แถบ “กาว”</text>
      <text x="22" y="262.8" class="sj">点線で壁を折り上げ、「กาว」(のりしろ)をはる</text>
    </g>
<g>
      <circle cx="16" cy="270.40000000000003" r="3.1" fill="#f5c66a"/>
      <text x="16" y="271.6" class="num">5</text>
      <text x="22" y="270.6" class="st">พับปลายกลีบออกด้านนอก แล้วถ่ายภาพจากด้านบน</text>
      <text x="22" y="275.20000000000005" class="sj">花びらの先を外に折り、真上から撮影する</text>
    </g>
