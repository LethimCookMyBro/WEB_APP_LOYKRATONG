<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A4 Krathong Template</title>
<link rel="icon" href="/assets/lotus.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600&family=Noto+Sans+Thai:wght@400;600&display=swap" rel="stylesheet">
<style>
  @page { size: A4; margin: 0; }
  html, body { margin: 0; background: #2a2d45; font-family: 'Noto Sans Thai', sans-serif; }
  .bar { position: sticky; top: 0; display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap;
         padding: 12px 16px; background: #111433; color: #f7f2e8; z-index: 2; }
  .bar button, .bar a { font: inherit; padding: 10px 18px; border-radius: 999px; border: 0; cursor: pointer; text-decoration: none;
         background: linear-gradient(135deg, #ffe3a3, #f5c66a 45%, #e3a23b); color: #2b1a00; font-weight: 600; }
  .bar a.ghost { background: transparent; color: #ffe1a1; border: 1px solid rgba(255,225,161,.5); }
  .bar small { color: #b8b3cc; width: 100%; text-align: center; }
  .sheet { width: 210mm; height: 297mm; margin: 16px auto; background: #fff; box-shadow: 0 10px 40px rgba(0,0,0,.4); }
  .sheet svg { width: 100%; height: 100%; display: block; }
  @media screen and (max-width: 840px) { .sheet { width: 96vw; height: calc(96vw * 297 / 210); } }
  @media print { .bar { display: none; } html, body { background: #fff; } .sheet { margin: 0; box-shadow: none; width: 210mm; height: 297mm; } }
</style>
</head>
<body>
  <div class="bar">
    <button onclick="window.print()">🖨️ พิมพ์ · 印刷</button>
    <a class="ghost" href="/assets/templates/a4-origami-sheet.pdf" download>PDF</a>
    <small>พิมพ์ขนาดจริง 100% (Actual size) · 実寸で印刷</small>
  </div>
  <div class="sheet" id="sheet"></div>
  <script type="module">
    import { buildTemplateSVG } from '/js/template-svg.js';
    const params = new URLSearchParams(location.search);
    const withQr = params.get('qr') !== '0';
    let joinUrl = '';
    try { joinUrl = (await (await fetch('/api/config')).json()).joinUrl; } catch {}
    document.getElementById('sheet').innerHTML = buildTemplateSVG({ qrHref: withQr ? '/qr.svg?t=' + Date.now() : null, joinUrl: withQr ? joinUrl : '' });
  </script>
</body>
</html>
